<!DOCTYPE html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <title>Deep Research Agent</title>
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <script src="https://cdn.tailwindcss.com"></script>
    <script src="https://cdn.jsdelivr.net/npm/marked/marked.min.js"></script>
    <style>
      .chat-prose h2 { font-size: 1rem; font-weight: 700; margin-top: 1rem; margin-bottom: 0.5rem; }
      .chat-prose h2:first-child { margin-top: 0; }
      .chat-prose ul { margin: 0.5rem 0; padding-left: 1.25rem; list-style-type: disc; }
      .chat-prose li { margin: 0.25rem 0; }
      .chat-prose p { margin: 0.5rem 0; }
    </style>
  </head>
  <body class="bg-white text-gray-900 text-base">
    <div class="h-screen flex overflow-hidden">
      <aside id="sidebar" class="hidden md:flex md:flex-col w-72 border-r border-gray-200 bg-gray-50">
        <div class="px-4 py-4 border-b border-gray-200 flex items-center justify-between">
          <h1 class="text-xl font-semibold">Deep Research Agent</h1>
        </div>
        <div class="flex-1 overflow-y-auto" id="session-list">
          <div class="p-4 text-sm text-gray-500">Conversation history will appear here.</div>
        </div>
      </aside>
      <main class="flex-1 flex flex-col">
        <header class="px-4 py-3 border-b border-gray-200 flex items-center justify-between gap-2">
          <div class="flex items-center gap-2">
            <button id="toggle-history-btn" type="button" class="inline-flex items-center justify-center w-9 h-9 rounded-full border border-gray-300 text-gray-600 hover:bg-gray-100 hover:text-gray-900" title="Toggle conversation list">
              <svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 24 24" fill="none" class="w-4 h-4">
                <path d="M4 6h16M4 12h10M4 18h7" stroke="currentColor" stroke-width="1.8" stroke-linecap="round" />
              </svg>
            </button>
          </div>
          <div class="flex items-center gap-2">
            <button id="new-chat-btn" class="text-sm px-3 py-1.5 rounded-full border border-gray-300 hover:bg-gray-100">New Chat</button>
          </div>
        </header>
        <section id="chat-window" class="flex-1 min-h-0 overflow-y-auto px-4 py-4 space-y-4 bg-white">
          <div id="chat-placeholder" class="text-center text-gray-400 text-base mt-8">Ask a question to start deep research.</div>
        </section>
        <section class="border-t border-gray-200 bg-white px-4 py-3">
          <form id="chat-form" class="max-w-3xl mx-auto flex items-end gap-2">
            <textarea id="message-input" rows="1" class="flex-1 resize-none rounded-2xl border border-gray-300 px-3 py-2 text-base leading-relaxed focus:outline-none focus:ring-2 focus:ring-emerald-500 focus:border-emerald-500 max-h-64 overflow-y-auto" placeholder="Type your question here... (Shift+Enter for new line)"></textarea>
            <button type="submit" id="send-button" class="inline-flex items-center justify-center rounded-full bg-emerald-600 text-white px-5 py-2.5 text-base font-medium hover:bg-emerald-700 disabled:opacity-50 disabled:cursor-not-allowed">Send</button>
          </form>
        </section>
      </main>
    </div>
    <script>
      let currentSessionId = null;
      let selectedSessionElement = null;
      let agentProgressIntervalId = null;
      function getCookie(name) {
        const value = `; ${document.cookie}`;
        const parts = value.split(`; ${name}=`);
        if (parts.length === 2) return parts.pop().split(";").shift();
      }
      function hidePlaceholder() {
        const el = document.getElementById("chat-placeholder");
        if (el) el.classList.add("hidden");
      }
      var markedOptionsSet = false;
      function parseMarkdown(text) {
        if (!text) return "";
        try {
          if (window.marked && typeof window.marked.parse === "function") {
            if (!markedOptionsSet) { window.marked.setOptions({ gfm: true, breaks: true }); markedOptionsSet = true; }
            return window.marked.parse(text);
          }
        } catch (e) { console.error("Markdown parse error", e); }
        return text.replace(/</g, "&lt;").replace(/>/g, "&gt;");
      }
      function splitReportAndFooter(content) {
        if (typeof content !== "string") return { report: "", footer: "" };
        const idx = content.indexOf("\n\nSources:");
        if (idx === -1) return { report: content, footer: "" };
        return { report: content.slice(0, idx).trim(), footer: content.slice(idx).trim() };
      }
      function appendMessage(role, content, chartImageBase64) {
        const chatWindow = document.getElementById("chat-window");
        hidePlaceholder();
        const wrapper = document.createElement("div");
        wrapper.className = "flex w-full flex-shrink-0";
        wrapper.classList.add(role === "user" ? "justify-end" : "justify-start");
        const bubble = document.createElement("div");
        bubble.className = "max-w-[75%] rounded-2xl px-4 py-3 text-base overflow-hidden";
        if (role === "user") {
          bubble.classList.add("bg-emerald-600", "text-white", "rounded-br-sm");
          bubble.style.whiteSpace = "pre-wrap";
          bubble.textContent = content;
        } else {
          bubble.classList.add("bg-gray-100", "text-gray-900", "rounded-bl-sm");
          const { report, footer } = splitReportAndFooter(content);
          const inner = document.createElement("div");
          inner.className = "chat-prose prose prose-sm max-w-none text-gray-900 break-words";
          inner.innerHTML = parseMarkdown(report || content);
          bubble.appendChild(inner);
          if (chartImageBase64) {
            const imgWrapper = document.createElement("div");
            imgWrapper.className = "mt-3 border border-gray-300 rounded-lg overflow-hidden bg-white";
            const img = document.createElement("img");
            img.src = "data:image/png;base64," + chartImageBase64;
            img.alt = "Generated chart";
            img.className = "w-full h-auto block";
            imgWrapper.appendChild(img);
            bubble.appendChild(imgWrapper);
          }
          if (footer) {
            const footerEl = document.createElement("div");
            footerEl.className = "mt-3 pt-2 border-t border-gray-300 text-xs text-gray-500";
            footerEl.style.whiteSpace = "pre-wrap";
            footerEl.textContent = footer;
            bubble.appendChild(footerEl);
          }
        }
        wrapper.appendChild(bubble);
        chatWindow.appendChild(wrapper);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
      function showAgentProgress() {
        hidePlaceholder();
        const chatWindow = document.getElementById("chat-window");
        const existing = document.getElementById("agent-progress-indicator");
        if (existing) existing.remove();

        const wrapper = document.createElement("div");
        wrapper.className = "flex w-full justify-start";
        wrapper.id = "agent-progress-indicator";

        const bubble = document.createElement("div");
        bubble.className =
          "max-w-[75%] rounded-2xl px-4 py-3 text-sm bg-gray-100 text-gray-700 rounded-bl-sm";

        const title = document.createElement("div");
        title.className = "font-medium mb-1 flex items-center gap-2";
        title.innerHTML = 'Agent is working... <span class="inline-block w-2 h-2 rounded-full bg-emerald-500 animate-pulse"></span>';
        bubble.appendChild(title);

        const list = document.createElement("ul");
        list.id = "agent-steps-list";
        list.className = "mt-1 space-y-0.5 text-xs";
        bubble.appendChild(list);

        wrapper.appendChild(bubble);
        chatWindow.appendChild(wrapper);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
      function appendAgentStep(stepText) {
        const list = document.getElementById("agent-steps-list");
        if (!list) return;
        const li = document.createElement("li");
        li.className = "flex items-center gap-2 text-gray-800";
        const dot = document.createElement("span");
        dot.className = "inline-block w-2 h-2 rounded-full bg-green-500 flex-shrink-0";
        const text = document.createElement("span");
        text.textContent = stepText;
        li.appendChild(dot);
        li.appendChild(text);
        list.appendChild(li);
        const chatWindow = document.getElementById("chat-window");
        if (chatWindow) chatWindow.scrollTop = chatWindow.scrollHeight;
      }
      function removeAgentProgress() {
        if (agentProgressIntervalId) {
          window.clearInterval(agentProgressIntervalId);
          agentProgressIntervalId = null;
        }
        const el = document.getElementById("agent-progress-indicator");
        if (el) el.remove();
      }
      function renderAgentTrace(trace) {
        if (!Array.isArray(trace) || trace.length === 0) return;
        const chatWindow = document.getElementById("chat-window");
        const wrapper = document.createElement("div");
        wrapper.className = "flex w-full justify-start";

        const bubble = document.createElement("div");
        bubble.className =
          "max-w-[75%] rounded-2xl px-4 py-3 text-xs bg-gray-50 text-gray-700 border border-gray-200 rounded-bl-sm";

        const title = document.createElement("div");
        title.className = "font-semibold mb-1";
        title.textContent = "How the agent answered:";
        bubble.appendChild(title);

        const list = document.createElement("ol");
        list.className = "list-decimal list-inside space-y-0.5";
        trace.forEach((step) => {
          const li = document.createElement("li");
          li.textContent = step;
          list.appendChild(li);
        });

        bubble.appendChild(list);
        wrapper.appendChild(bubble);
        chatWindow.appendChild(wrapper);
        chatWindow.scrollTop = chatWindow.scrollHeight;
      }
      function hideFinalReport() {
        const container = document.getElementById("final-report-container");
        if (container) { container.classList.add("hidden"); container.innerHTML = ""; }
      }
      function renderHistory(messages) {
        const chatWindow = document.getElementById("chat-window");
        chatWindow.innerHTML = '<div id="chat-placeholder" class="text-center text-gray-400 text-base mt-8 hidden">Ask a question to start deep research.</div>';
        if (messages.length === 0) document.getElementById("chat-placeholder").classList.remove("hidden");
        else messages.forEach((msg) => appendMessage(msg.role, msg.content));
        hideFinalReport();
      }
      async function loadHistory(sessionId) {
        if (!sessionId) return;
        currentSessionId = sessionId;
        try {
          const res = await fetch(`/api/chat/history/${sessionId}/`);
          if (!res.ok) return;
          const data = await res.json();
          renderHistory(data);
        } catch (e) { console.error("Failed to load history", e); }
      }
      function renderSessionList(sessions) {
        const listEl = document.getElementById("session-list");
        listEl.innerHTML = "";
        if (!sessions.length) {
          listEl.innerHTML = '<div class="p-4 text-sm text-gray-500">No conversations yet.</div>';
          return;
        }
        sessions.forEach((session) => {
          const item = document.createElement("button");
          item.type = "button";
          item.dataset.sessionId = session.id;
          item.className = "w-full text-left px-4 py-3 text-sm border-b border-gray-100 hover:bg-gray-100 transition-colors";
          const title = document.createElement("div");
          title.className = "font-medium text-gray-900 truncate";
          title.textContent = session.last_message || "New conversation";
          const meta = document.createElement("div");
          meta.className = "text-xs text-gray-500 mt-0.5";
          meta.textContent = new Date(session.created_at).toLocaleString();
          item.appendChild(title);
          item.appendChild(meta);
          item.addEventListener("click", () => {
            if (selectedSessionElement) selectedSessionElement.classList.remove("bg-gray-100");
            item.classList.add("bg-gray-100");
            selectedSessionElement = item;
            loadHistory(session.id);
          });
          listEl.appendChild(item);
        });
      }
      async function fetchSessions() {
        try {
          const res = await fetch("/api/chat/sessions/");
          if (!res.ok) return;
          const data = await res.json();
          renderSessionList(data);
        } catch (e) { console.error("Failed to load sessions", e); }
      }
      document.getElementById("toggle-history-btn").addEventListener("click", () => {
        const sidebar = document.getElementById("sidebar");
        const toggleBtn = document.getElementById("toggle-history-btn");
        if (!sidebar) return;
        const isVisible = sidebar.classList.contains("md:flex");
        if (isVisible) {
          sidebar.classList.remove("md:flex"); sidebar.classList.add("md:hidden");
          if (toggleBtn) { toggleBtn.classList.remove("bg-gray-900", "text-white"); toggleBtn.classList.add("border-gray-300", "text-gray-600"); }
        } else {
          sidebar.classList.remove("md:hidden"); sidebar.classList.add("md:flex");
          if (toggleBtn) { toggleBtn.classList.remove("border-gray-300", "text-gray-600"); toggleBtn.classList.add("bg-gray-900", "text-white"); }
        }
      });
      document.getElementById("new-chat-btn").addEventListener("click", () => {
        currentSessionId = null;
        if (selectedSessionElement) { selectedSessionElement.classList.remove("bg-gray-100"); selectedSessionElement = null; }
        const chatWindow = document.getElementById("chat-window");
        chatWindow.innerHTML = '<div id="chat-placeholder" class="text-center text-gray-400 text-base mt-8">Ask a question to start deep research.</div>';
        hideFinalReport();
      });
      document.getElementById("chat-form").addEventListener("submit", async (event) => {
        event.preventDefault();
        const input = document.getElementById("message-input");
        const message = input.value.trim();
        if (!message) return;
        hideFinalReport();
        appendMessage("user", message);
        input.value = "";
        input.style.height = "auto";
        const sendButton = document.getElementById("send-button");
        sendButton.disabled = true;
        showAgentProgress();
        try {
          const res = await fetch("/api/chat/send/stream", {
            method: "POST",
            headers: { "Content-Type": "application/json" },
            body: JSON.stringify({ message: message, session_id: currentSessionId }),
          });
          if (!res.ok) {
            removeAgentProgress();
            appendMessage("assistant", "Sorry, something went wrong while processing your request.");
            sendButton.disabled = false;
            return;
          }
          const reader = res.body.getReader();
          const decoder = new TextDecoder();
          let buffer = "";
          let doneData = null;
          while (true) {
            const { value, done } = await reader.read();
            if (done) break;
            buffer += decoder.decode(value, { stream: true });
            const parts = buffer.split("\n\n");
            buffer = parts.pop() || "";
            for (const part of parts) {
              const lines = part.split("\n");
              let eventType = "message";
              let dataStr = "";
              for (const line of lines) {
                if (line.startsWith("event: ")) eventType = line.slice(7).trim();
                else if (line.startsWith("data: ")) dataStr = line.slice(6);
              }
              if (!dataStr) continue;
              try {
                const data = JSON.parse(dataStr);
                if (eventType === "step" && data.step) {
                  appendAgentStep(data.step);
                } else if (eventType === "done") {
                  doneData = data;
                } else if (eventType === "error") {
                  removeAgentProgress();
                  appendMessage("assistant", "Error: " + (data.detail || "Something went wrong."));
                }
              } catch (parseErr) {
                if (eventType === "error") {
                  removeAgentProgress();
                  appendMessage("assistant", "Something went wrong.");
                }
              }
            }
          }
          if (buffer.trim()) {
            const lines = buffer.split("\n");
            let eventType = "message";
            let dataStr = "";
            for (const line of lines) {
              if (line.startsWith("event: ")) eventType = line.slice(7).trim();
              else if (line.startsWith("data: ")) dataStr = line.slice(6);
            }
            if (dataStr) {
              try {
                const data = JSON.parse(dataStr);
                if (eventType === "done") doneData = data;
              } catch (_) {}
            }
          }
          removeAgentProgress();
          if (doneData) {
            currentSessionId = doneData.session_id;
            const assistantContent = (doneData.final_report && doneData.final_report.trim() !== "") ? doneData.final_report : (doneData.agent_message || "");
            appendMessage("assistant", assistantContent, doneData.chart_image_base64);
            fetchSessions();
          } else {
            appendMessage("assistant", "Sorry, the response could not be completed.");
          }
        } catch (e) {
          console.error("Send failed", e);
          removeAgentProgress();
          appendMessage("assistant", "Network error. Please try again in a moment.");
        } finally {
          sendButton.disabled = false;
        }
      });
      const messageInput = document.getElementById("message-input");
      const maxHeightPx = 320;
      messageInput.addEventListener("input", () => {
        messageInput.style.height = "auto";
        messageInput.style.height = `${Math.min(messageInput.scrollHeight, maxHeightPx)}px`;
      });
      messageInput.addEventListener("keydown", (event) => {
        if (event.key === "Enter" && !event.shiftKey) {
          event.preventDefault();
          document.getElementById("chat-form").dispatchEvent(new Event("submit"));
        }
      });
      fetchSessions();
    </script>
  </body>
</html>
